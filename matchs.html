<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>IRDL — Saisie des matchs</title>

<style>
body { font-family:Arial; margin:0; background:#f4f8fb; }

header {
 background: linear-gradient(90deg,#2F2C7E,#1B8FC4,#8CC63F);
 padding:15px;
 color:white;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

header img { height:55px; }

nav a { color:white; margin-left:20px; text-decoration:none; font-weight:bold; }

main { padding:20px; text-align:center; }

.tabs button {
 padding:10px 20px;
 margin:5px;
 background:#1B8FC4;
 color:white;
 border:none;
 border-radius:8px;
 cursor:pointer;
}

.match {
 background:white;
 margin:10px auto;
 padding:15px;
 width:380px;
 border-radius:12px;
 box-shadow:0 4px 10px rgba(0,0,0,.15);
}

input { width:60px; text-align:center; font-size:16px; }

button { margin-top:8px; padding:8px 18px; background:#8CC63F; border:none; border-radius:6px; font-weight:bold; }

.stats {
 background:white;
 margin:20px auto;
 padding:15px;
 width:420px;
 border-radius:12px;
 box-shadow:0 4px 10px rgba(0,0,0,.15);
 text-align:left;
}
</style>
</head>

<body>

<header>
<img src="logo.png">
<nav>
<a href="index.html">Accueil</a>
<a href="poules.html">Classement</a>
</nav>
</header>

<main>

<h1>🎯 Saisie des matchs — score restant</h1>
<p>Entrez le score restant (301 = finish)</p>

<div class="tabs">
<button onclick="showPoule('A')">Poule A</button>
<button onclick="showPoule('B')">Poule B</button>
<button onclick="showPoule('C')">Poule C</button>
</div>

<div id="matchs"></div>

<div class="stats">
<h3>📊 Statistiques joueurs</h3>
<div id="stats"></div>
</div>

</main>

<script>

const poules = {
A:["Lisa","Miako","Clément","Théotime","Edwige","Maxence"],
B:["Vladimir","Marie","Kelig","Kilyan","Julie","Xavier"],
C:["Guillaume","Ilias","Nivesh","Mathis","Vincent","Thibault"]
}

let matchs = {}   // ⚠️ plus de localStorage

function calcPoints(r1, r2){
 if(r1 === 301 && r2 !== 301) return [3, r2 >= 281 ? 1 : 0]
 if(r2 === 301 && r1 !== 301) return [r1 >= 281 ? 1 : 0, 3]
 if(r2 === 0 && r1 === 0) return [0,0]
 if(r1 > r2) return [1,0]
 if(r2 > r1) return [0,1]
 return [1,1]
}

function showPoule(p){

 let html=""
 let joueurs=poules[p]

 for(let i=0;i<joueurs.length;i++){
  for(let j=i+1;j<joueurs.length;j++){

   let j1=joueurs[i], j2=joueurs[j]
   let id=j1+"-"+j2
   let m=matchs[id]||{}

   html+=`
   <div class="match">
   <b>${j1}</b>
   <input id="${id}r1" type="number" min="0" max="301" value="${m.r1||""}">
   vs
   <input id="${id}r2" type="number" min="0" max="301" value="${m.r2||""}">
   <b>${j2}</b>
   <br>
   <button onclick="valider('${id}','${j1}','${j2}')">Valider</button>
   </div>`
  }
 }

 document.getElementById("matchs").innerHTML=html
}

function valider(id,j1,j2){

 let r1 = parseInt(document.getElementById(id+"r1").value)
 let r2 = parseInt(document.getElementById(id+"r2").value)

 if(isNaN(r1)) r1=0
 if(isNaN(r2)) r2=0

 let [p1,p2]=calcPoints(r1,r2)

 saveMatchFirebase(id, { j1, j2, r1, r2, p1, p2 })
 alert("Résultat enregistré 👍")
}

// ===== STATS =====
function calculStats(){

 let stats={}

 for(let p in poules)
  poules[p].forEach(j=>stats[j]={pts:0,matchs:0,win:0})

 for(let m in matchs){
  let d=matchs[m]
  stats[d.j1].pts+=d.p1
  stats[d.j2].pts+=d.p2
  stats[d.j1].matchs++
  stats[d.j2].matchs++
  if(d.p1>d.p2) stats[d.j1].win++
  if(d.p2>d.p1) stats[d.j2].win++
 }

 let html=""
 for(let j in stats){
  html+=`${j} : ${stats[j].pts} pts — ${stats[j].win} victoires<br>`
 }

 document.getElementById("stats").innerHTML=html
}

</script>

<!-- 🔥 FIREBASE -->
<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getFirestore,
 doc,
 setDoc,
 onSnapshot,
 collection
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS4nH-NXR28FZOrcTV-Gb4abHqyq2LgNc",
  authDomain: "tournois-flechettes-irdl.firebaseapp.com",
  projectId: "tournois-flechettes-irdl",
  storageBucket: "tournois-flechettes-irdl.firebasestorage.app",
  messagingSenderId: "1041216462525",
  appId: "1:1041216462525:web:9d18e15a6167396378a1d4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveMatchFirebase = async function(id,data){
 await setDoc(doc(db,"matchs",id), data)
}

// 🔴 SYNCHRO TEMPS REEL
onSnapshot(collection(db,"matchs"), snap => {

 matchs = {}

 snap.forEach(doc => {
  matchs[doc.id] = doc.data()
 })

 showPoule("A")
 calculStats()

})

</script>

</body>
</html>
